id = "herdr-crew"
name = "herdr crew"
version = "0.1.0"
min_herdr_version = "0.9.1"
platforms = ["macos", "linux", "windows"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[actions]]
id = "up"
title = "Start or complete the project's sessions"
contexts = ["workspace", "pane"]
command = ["target/release/herdr-crew", "up"]
