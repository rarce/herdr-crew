[package]
name = "herdr-crew"
version = "0.1.0"
edition = "2024"
default-run = "herdr-crew"
description = "herdr plugin that starts Claude Code or Codex sessions per role and draws their status board"
license = "MIT"
repository = "https://github.com/rarce/herdr-crew"
publish = false

[dependencies]
jiff = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }
