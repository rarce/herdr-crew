name: Bug report
description: Something in herdr-crew does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security vulnerability, do not use this form: report it privately as described in [SECURITY.md](https://github.com/rarce/herdr-crew/blob/main/SECURITY.md).

        Please remove credentials, tokens, private repository names and anything else you would not post publicly from every field below, including logs and `crew.toml`.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of commands that shows the problem, starting from how herdr was launched (`herdr`, `herdr-crew up`, the `up` action, a restore...).
      placeholder: |
        1. cd my-project && herdr-crew init --preset review --yes
        2. herdr-crew up --no-attach
        3. ...
    validations:
      required: true

  - type: dropdown
    id: agents
    attributes:
      label: Agents in the crew
      options:
        - Claude Code only
        - Codex only
        - Claude Code and Codex
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26.0 (arm64), Ubuntu 24.04 (x86_64)...
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How herdr-crew is installed
      options:
        - herdr plugin install (marketplace)
        - herdr plugin install --ref <tag>
        - herdr plugin link from a checkout
        - Binary run directly from a checkout
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Paste the output of these commands. Skip the agents your crew does not use.
      render: text
      placeholder: |
        $ herdr-crew --version
        $ herdr --version
        $ claude --version
        $ codex --version
        $ git --version
    validations:
      required: true

  - type: textarea
    id: check
    attributes:
      label: Output of `herdr-crew check`
      description: Run it from the project's directory.
      render: text
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: "`.herdr/crew.toml`"
      description: The configuration, or the relevant part of it, with private details removed.
      render: toml

  - type: textarea
    id: logs
    attributes:
      label: Logs and plan
      description: |
        Whatever applies:
        - `herdr-crew up --dry-run` from the project, to show what crew sees now;
        - `herdr plugin log list --plugin herdr-crew` for problems with the startup hook or the `up` action;
        - the error printed by the command that failed.
      render: text
