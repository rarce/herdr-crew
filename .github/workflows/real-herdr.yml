name: Real herdr integration

on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HERDR_VERSION: 0.9.3
      CODEX_VERSION: 0.160.1
      CREW_REAL_HERDR: '1'
      CREW_REAL_CODEX: '1'
      # Short socket paths also fit macOS's 104-byte sun_path limit.
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Codex for local protocol inspection
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/codex-tools"
          npm install --no-audit --no-fund --prefix "$tools" "@openai/codex@$CODEX_VERSION"
          "$tools/node_modules/.bin/codex" --version
          printf '%s\n' "$tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install pinned herdr in the runner's temporary directory
        shell: bash
        run: |
          set -euo pipefail
          # Digests from https://github.com/herdrdev/herdr/releases/expanded_assets/v0.9.3
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)
              asset=herdr-linux-x86_64
              digest=18a8dc65f1c2fa485884344356dea1cfd911c6f06cf46fa78e193f4087f4dba7 ;;
            Linux-aarch64)
              asset=herdr-linux-aarch64
              digest=4de7aa3e25678812e92960de64f7c2aaa1bca1f0f80a3c5e559837e231e1f5c0 ;;
            Darwin-arm64)
              asset=herdr-macos-aarch64
              digest=5173a3e0ae42d5d1ab7ebfa5d5e6329f7c3d23f8e1a3677c7ce3231da2884157 ;;
            Darwin-x86_64)
              asset=herdr-macos-x86_64
              digest=db62d548ff3e832b087a96b1894a08d26be3905f1830309cd556783f215d4054 ;;
            *) echo 'Unsupported runner platform' >&2; exit 1 ;;
          esac
          tools="$RUNNER_TEMP/herdr-tools"
          mkdir -p "$tools"
          curl --fail --location --retry 3 --output "$tools/herdr" \
            "https://github.com/herdrdev/herdr/releases/download/v${HERDR_VERSION}/${asset}"
          printf '%s  %s\n' "$digest" "$tools/herdr" | shasum -a 256 --check
          chmod +x "$tools/herdr"
          "$tools/herdr" --version
          printf '%s\n' "$tools" >> "$GITHUB_PATH"
      - name: Test isolated sessions, startup, configured Codex restoration and launcher resolution
        run: cargo test --locked --test real_herdr --test codex_herdr --test launcher -- --ignored --nocapture
      - name: Inspect real Codex developer context using a local mock provider
        run: cargo test --locked --test execution real_codex_sends -- --ignored --nocapture
