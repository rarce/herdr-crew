name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Includes stateful, offline CLI flows in tests/execution.rs on both platforms.
      # Pinned real-herdr integration runs separately on a schedule or manual dispatch.
      - run: cargo test --locked
      - run: sh scripts/build.sh
